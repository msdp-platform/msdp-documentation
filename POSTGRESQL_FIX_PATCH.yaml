# PostgreSQL Fix for Azure Disk lost+found Issue
# This patch fixes the CrashLoopBackOff issue by using PGDATA subdirectory

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: local-msdp-user
spec:
  template:
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: "msdp_users"
        - name: POSTGRES_USER
          value: "msdp_user"
        - name: POSTGRES_PASSWORD
          value: "msdp_password"
        - name: POSTGRES_INITDB_ARGS
          value: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - msdp_user
            - -d
            - msdp_users
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - msdp_user
            - -d
            - msdp_users
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
